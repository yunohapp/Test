<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — DIGITA</title><link rel="stylesheet" href="index.html"><style>body{margin:0;font-family:Arial;background:#f7f7fb;color:#17182b}.box{max-width:1000px;margin:55px auto;padding:20px;display:grid;grid-template-columns:1.2fr .8fr;gap:25px}.card{background:#fff;border:1px solid #e5e5ee;border-radius:14px;padding:25px}h1{font-size:44px}.ey{color:#6336f5;font-size:11px;font-weight:900;letter-spacing:2px}input,select{width:100%;padding:13px;margin:7px 0;border:1px solid #ddd;border-radius:8px}.btn{background:#6336f5;color:#fff;border:0;border-radius:8px;padding:13px 18px;font-weight:800;width:100%;margin-top:10px}.line{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee}.total{display:flex;justify-content:space-between;font-size:20px;margin-top:17px}.note{background:#fff5db;padding:12px;border-radius:8px;font-size:12px;color:#795e00}@media(max-width:750px){.box{grid-template-columns:1fr}}</style></head><body><div class="box"><section><div class="ey">CHECKOUT</div><h1>Complete your order</h1><p>Enter your details. The current public demo records orders in the browser; real payment processing requires your merchant gateway/backend.</p><form id="f"><input id="name" required placeholder="Full name"><input id="email" required type="email" placeholder="Email"><input id="phone" required placeholder="Phone number"><select id="payment" required><option value="">Choose payment</option><option>M-Pesa</option><option>Airtel Money</option><option>Tigo Pesa</option><option>Card</option></select><button class="btn">Place order</button></form><p class="note">Do not accept real customer payments until a live payment provider and secure backend are connected.</p></section><aside class="card"><h2>Order summary</h2><div id="summary"></div><div class="total"><span>Total</span><b id="tot">TZS 0</b></div></aside></div><script>const c=JSON.parse(localStorage.getItem("digita_cart")||"[]"),fmt=n=>"TZS "+n.toLocaleString("en-TZ"),total=c.reduce((s,x)=>s+x.p,0);document.getElementById("summary").innerHTML=c.length?c.map(x=>"<div class='line'><span>"+x.n+"</span><b>"+fmt(x.p)+"</b></div>").join(""):"<p>Cart is empty. <a href='index.html#shop'>Go shopping.</a></p>";document.getElementById("tot").textContent=fmt(total);document.getElementById("f").addEventListener("submit",e=>{e.preventDefault();if(!c.length)return;const o={id:"DG"+Date.now().toString().slice(-8),name:name.value,email:email.value,phone:phone.value,payment:payment.value,total,items:c,status:"Pending",date:new Date().toISOString()};localStorage.setItem("digita_last_order",JSON.stringify(o));const old=JSON.parse(localStorage.getItem("digita_orders")||"[]");old.push(o);localStorage.setItem("digita_orders",JSON.stringify(old));localStorage.removeItem("digita_cart");location.href="success.html"})</script></body></html>
